<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CivicOS Labs — Curriculum Access</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-box {
            width: min(440px, 100%);
            padding: 3rem 2.5rem;
            border: 1px solid var(--line-strong);
            background: var(--black-soft);
        }
        .login-box .section-label {
            margin-bottom: 0.5rem;
            display: block;
        }
        .login-box h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .login-box .login-sub {
            color: var(--ash);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ash);
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--black);
            border: 1px solid var(--line);
            color: var(--paper);
            font-family: var(--sans);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--ember);
        }
        .form-group input::placeholder {
            color: var(--ash);
            opacity: 0.5;
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--ember);
            color: var(--paper);
            font-family: var(--mono);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .login-btn:hover {
            background: var(--ember-deep);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-error {
            color: var(--ember);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            font-family: var(--mono);
            letter-spacing: 0.02em;
        }
        .login-error.visible {
            display: block;
        }
        .login-back {
            display: block;
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--ash);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <span class="section-label">CivicOS Labs / Restricted</span>
            <h1>Curriculum Access</h1>
            <p class="login-sub">Advanced deployment curriculum materials require authorized access. Enter your credentials to continue.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Authenticate →</button>
                <p class="login-error" id="loginError">Invalid credentials. Try again or contact info@civicoslabs.com.</p>
            </form>
            <a href="/" class="login-back">← Back to civicoslabs.com</a>
        </div>
    </div>

    <script>
    // Inline auth — no external dependency to avoid load failures
    (function() {
        var AUTH_CONFIG = {
            USER_HASH: "2a96f9a78be0c8bb728431d148cf2c8edfe617237b8d72d0ccac55b31d053d51",
            PASS_HASH: "faf3529fece1b1dd55ef39153f7889a0f484ff7ebbf3594ad089610959476bc9",
            SESSION_DURATION: 8 * 60 * 60 * 1000,
            SESSION_KEY: 'civicos_pub_auth'
        };

        function sha256(message) {
            var msgBuffer = new TextEncoder().encode(message);
            return crypto.subtle.digest('SHA-256', msgBuffer).then(function(hashBuffer) {
                var hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            });
        }

        var form = document.getElementById('loginForm');
        var btn = document.getElementById('loginBtn');
        var errorEl = document.getElementById('loginError');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            errorEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Verifying…';

            Promise.all([sha256(username), sha256(password)]).then(function(hashes) {
                var userHash = hashes[0];
                var passHash = hashes[1];

                if (userHash === AUTH_CONFIG.USER_HASH && passHash === AUTH_CONFIG.PASS_HASH) {
                    var session = {
                        user: username,
                        ts: Date.now(),
                        token: (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substr(2))
                    };
                    sessionStorage.setItem(AUTH_CONFIG.SESSION_KEY, JSON.stringify(session));
                    window.location.href = '/publishing/';
                } else {
                    errorEl.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = 'Authenticate →';
                }
            }).catch(function(err) {
                errorEl.textContent = 'Authentication error. Please try again.';
                errorEl.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Authenticate →';
            });
        });
    })();
    </script>
</body>
</html>
