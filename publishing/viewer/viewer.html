<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Document Viewer</title>
    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            height: 100%;
            overflow: hidden;
        }
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13,11,10,0.95);
            border-top: 1px solid rgba(243,234,220,0.18);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 100;
            font-family: "DM Mono", "Courier New", monospace;
            font-size: 0.75rem;
            color: #8c8175;
        }
        .controls button {
            background: none;
            border: 1px solid rgba(243,234,220,0.18);
            color: #cbbdab;
            padding: 0.3rem 0.8rem;
            font-family: inherit;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .controls button:hover {
            border-color: rgba(211,75,47,0.58);
            color: #d34b2f;
        }
        .controls .page-info {
            min-width: 80px;
            text-align: center;
        }
        .pages-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 42px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            gap: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: #8c8175 #1a1a1a;
        }
        .pages-container::-webkit-scrollbar { width: 6px; }
        .pages-container::-webkit-scrollbar-track { background: #1a1a1a; }
        .pages-container::-webkit-scrollbar-thumb { background: #8c8175; border-radius: 0; }
        .pages-container canvas {
            display: block;
            max-width: 100%;
            height: auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .loading {
            color: #8c8175;
            font-family: "DM Mono", monospace;
            font-size: 0.8rem;
            padding-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="pages-container" id="pagesContainer">
        <p class="loading" id="loadingMsg">Loading document…</p>
    </div>

    <div class="controls">
        <button id="btnPrev">← Prev</button>
        <span class="page-info" id="pageInfo">1 / …</span>
        <button id="btnNext">Next →</button>
        <button id="btnZoomOut">−</button>
        <span id="zoomLevel">100%</span>
        <button id="btnZoomIn">+</button>
    </div>

    <script type="module">
        import pdfjsLib from './pdf.min.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

        const PDF_URL = '/publishing/assets/The_Open_Source_Student_FL_Educator_Edition_v1_0.pdf';
        const container = document.getElementById('pagesContainer');
        const loadingMsg = document.getElementById('loadingMsg');
        const pageInfo = document.getElementById('pageInfo');
        const zoomLevel = document.getElementById('zoomLevel');

        let pdfDoc = null;
        let currentPage = 1;
        let scale = 1.3;
        let pageCanvases = [];

        async function renderPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale });

            // Reuse or create canvas
            let canvas = pageCanvases[pageNum - 1];
            if (!canvas) {
                canvas = document.createElement('canvas');
                canvas.id = 'page-' + pageNum;
                pageCanvases[pageNum - 1] = canvas;
            }

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            await page.render({ canvasContext: ctx, viewport }).promise;
            return canvas;
        }

        async function renderAllPages() {
            loadingMsg.style.display = 'block';
            // Clear old canvases from DOM
            pageCanvases.forEach(c => { if (c && c.parentNode) c.parentNode.removeChild(c); });
            pageCanvases = [];

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const canvas = await renderPage(i);
                container.appendChild(canvas);
            }

            loadingMsg.style.display = 'none';
            pageInfo.textContent = '1 / ' + pdfDoc.numPages;
            scrollToPage(1);
        }

        function scrollToPage(num) {
            const canvas = pageCanvases[num - 1];
            if (canvas) {
                canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            pageInfo.textContent = num + ' / ' + pdfDoc.numPages;
        }

        // Controls
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; scrollToPage(currentPage); }
        });
        document.getElementById('btnNext').addEventListener('click', () => {
            if (currentPage < pdfDoc.numPages) { currentPage++; scrollToPage(currentPage); }
        });
        document.getElementById('btnZoomIn').addEventListener('click', () => {
            scale = Math.min(scale + 0.2, 3.0);
            zoomLevel.textContent = Math.round(scale / 1.3 * 100) + '%';
            renderAllPages();
        });
        document.getElementById('btnZoomOut').addEventListener('click', () => {
            scale = Math.max(scale - 0.2, 0.5);
            zoomLevel.textContent = Math.round(scale / 1.3 * 100) + '%';
            renderAllPages();
        });

        // Track visible page on scroll
        container.addEventListener('scroll', () => {
            for (let i = 0; i < pageCanvases.length; i++) {
                const c = pageCanvases[i];
                if (c) {
                    const rect = c.getBoundingClientRect();
                    if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
                        currentPage = i + 1;
                        pageInfo.textContent = currentPage + ' / ' + pdfDoc.numPages;
                    }
                }
            }
        });

        // Block all interaction within the viewer iframe
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // Load the PDF
        try {
            pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
            await renderAllPages();
        } catch (err) {
            loadingMsg.textContent = 'Failed to load document.';
            console.error(err);
        }
    </script>
</body>
</html>
