<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>CivicOS Labs — Publishing</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <style>
        .gate-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .gate-box {
            width: min(440px, 100%);
            padding: 3rem 2.5rem;
            border: 1px solid var(--line-strong);
            background: var(--black-soft);
            text-align: center;
        }
        .gate-box h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .gate-box p { color: var(--ash); margin-bottom: 1.5rem; }
        .gate-box a {
            display: inline-block;
            font-family: var(--mono);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--paper);
            background: var(--ember);
            padding: 0.6rem 1.2rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="gate-wrapper">
        <div class="gate-box">
            <span class="section-label">CivicOS Labs / Publishing</span>
            <h1>Access Restricted</h1>
            <p>Curriculum materials have moved to a secure environment. Contact info@civicoslabs.com for access.</p>
            <a href="/">← Back to civicoslabs.com</a>
        </div>
    </div>
</body>
</html>
